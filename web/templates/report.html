<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RepoPilot &mdash; {{title}}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="nav">
  <div class="nav-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>RepoPilot</div>
  <div class="nav-links">
    <a class="nav-link" href="/">Dashboard</a>
    <a class="nav-link" href="/pr">PR Analysis</a>
    <a class="nav-link" href="/onboarding">Onboarding</a>
    <a class="nav-link" href="/agents">Agents</a>
    <a class="nav-link" href="/report/pr">Release Report</a>
    <a class="nav-link" href="/report/onboard">Onboarding Brief</a>
  </div>
</nav>
<div class="page">
  <div class="page-header">
    <div class="page-title">{{title}}</div>
    <div style="display:flex;gap:10px;margin-top:14px;">
      <a href="/pr" class="btn btn-primary btn-sm">Re-run PR Analysis</a>
      <a href="/onboarding" class="btn btn-secondary btn-sm">Re-run Onboarding</a>
      <a href="/" class="btn btn-outline btn-sm">Dashboard</a>
    </div>
  </div>
  <div class="card"><div class="report-body">{{content}}</div></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
